<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Preload important images -->
    <link
      rel="preload"
      as="image"
      href="/logo.png"
    />

    <link
      rel="preload"
      as="image"
      href="/ad.png"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      OtoDeğer | Kıbrıs Araç Değerleme & North Cyprus Car Valuation
    </title>

    <meta
      name="description"
      content="OtoDeğer ile Kuzey Kıbrıs'ta aracınızın güncel piyasa değerini saniyeler içinde öğrenin. Free North Cyprus car valuation using current vehicle market data. Оценка стоимости автомобиля на Северном Кипре."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <link
      rel="canonical"
      href="https://www.otodeger.online/"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="OtoDeğer | Kıbrıs Araç Değerleme"
    />

    <meta
      property="og:description"
      content="Aracınızın Kuzey Kıbrıs piyasa değerini saniyeler içinde öğrenin."
    />

    <meta
      property="og:url"
      content="https://www.otodeger.online/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="OtoDeğer"
    />

    <meta
      property="og:locale"
      content="tr_TR"
    />

    <meta
      property="og:locale:alternate"
      content="en_GB"
    />

    <meta
      property="og:locale:alternate"
      content="ru_RU"
    />

    <!-- Twitter / Social -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="OtoDeğer | Kıbrıs Araç Değerleme"
    />

    <meta
      name="twitter:description"
      content="Kuzey Kıbrıs araç piyasasında aracınızın tahmini değerini saniyeler içinde öğrenin."
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "OtoDeğer",
        "alternateName": [
          "Kıbrıs Araç Değerleme",
          "North Cyprus Car Valuation",
          "KKTC Araç Değerleme"
        ],
        "url": "https://www.otodeger.online/",
        "description": "OtoDeğer is a vehicle valuation tool that helps users estimate car values using current North Cyprus vehicle market data.",
        "applicationCategory": "AutomotiveApplication",
        "operatingSystem": "Web",
        "isAccessibleForFree": true,
        "inLanguage": [
          "tr",
          "en",
          "ru"
        ],
        "areaServed": {
          "@type": "Place",
          "name": "North Cyprus"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "OtoDeğer",
        "url": "https://www.otodeger.online/",
        "description": "North Cyprus vehicle valuation and car market value tool.",
        "inLanguage": [
          "tr",
          "en",
          "ru"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
